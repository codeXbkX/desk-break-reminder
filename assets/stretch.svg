<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Original artwork for Stand Up Reminder (MIT). A friendly figure doing an
       arms-overhead stretch on a ~1.5s loop. No third-party assets. -->
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- ground shadow (breathes with the bob) -->
  <ellipse cx="200" cy="338" rx="46" ry="9" fill="#0f172a" opacity="0.24">
    <animate attributeName="rx" dur="1.5s" repeatCount="indefinite" calcMode="spline"
             keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
             values="46;39;46"/>
    <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" calcMode="spline"
             keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
             values="0.24;0.15;0.24"/>
  </ellipse>

  <!-- everything except the shadow bobs up slightly at full stretch -->
  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
                      dur="1.5s" repeatCount="indefinite" calcMode="spline"
                      keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                      values="0 0;0 -9;0 0"/>

    <!-- legs -->
    <rect x="180" y="238" width="18" height="84" rx="9" fill="#334155"/>
    <rect x="202" y="238" width="18" height="84" rx="9" fill="#334155"/>
    <!-- shoes -->
    <ellipse cx="189" cy="324" rx="16" ry="8" fill="#1f2937"/>
    <ellipse cx="211" cy="324" rx="16" ry="8" fill="#1f2937"/>

    <!-- neck -->
    <rect x="193" y="136" width="14" height="18" rx="6" fill="#e8b98f"/>

    <!-- torso -->
    <rect x="163" y="150" width="74" height="94" rx="26" fill="url(#shirt)"/>
    <!-- short sleeves (static shoulder caps) -->
    <ellipse cx="170" cy="170" rx="17" ry="20" fill="#4f46e5"/>
    <ellipse cx="230" cy="170" rx="17" ry="20" fill="#4f46e5"/>

    <!-- head -->
    <circle cx="200" cy="108" r="30" fill="#3b2a20"/>            <!-- hair -->
    <circle cx="200" cy="115" r="27" fill="#f1c27d"/>            <!-- face -->
    <circle cx="173" cy="116" r="5" fill="#e8b98f"/>             <!-- ears -->
    <circle cx="227" cy="116" r="5" fill="#e8b98f"/>
    <circle cx="191" cy="114" r="3.2" fill="#3b2a20"/>           <!-- eyes -->
    <circle cx="209" cy="114" r="3.2" fill="#3b2a20"/>
    <path d="M190,124 Q200,132 210,124" fill="none" stroke="#c77b52"
          stroke-width="3" stroke-linecap="round"/>              <!-- smile -->

    <!-- right arm (raises into an overhead V) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.5s"
                        repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                        values="-18 230 168;-131 230 168;-18 230 168"/>
      <rect x="222" y="168" width="16" height="94" rx="8" fill="#f1c27d"/>
      <circle cx="230" cy="264" r="10" fill="#f1c27d"/>
    </g>

    <!-- left arm (raises into an overhead V) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.5s"
                        repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                        values="18 170 168;131 170 168;18 170 168"/>
      <rect x="162" y="168" width="16" height="94" rx="8" fill="#f1c27d"/>
      <circle cx="170" cy="264" r="10" fill="#f1c27d"/>
    </g>
  </g>
</svg>
